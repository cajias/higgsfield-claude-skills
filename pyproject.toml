[project]
name = "higgsfield-claude-skills"
version = "0.0.0"
description = "Tests and tooling for the Higgsfield Claude Code plugin marketplace."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "sca-skills",
    "ruff>=0.15",
    "mypy>=1.13",
    "black>=24",
    "pytest>=8",
    "types-PyYAML",
    "PyYAML",
]

[tool.uv]
package = false

[tool.uv.sources]
sca-skills = { git = "https://github.com/cajias/lint-configs.git", subdirectory = "python" }

# Ruff: extend the shared sca-skills config. The absolute path to the bundled
# ruff.toml is machine-specific, so `make lint` resolves it dynamically via
# get_ruff_config_path() and passes --config. The block below is the portable
# project-local override used when ruff runs without that flag.
[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = [".venv", "plugins"]

[tool.ruff.lint.isort]
known-first-party = ["tests"]

# Mirror of the shared sca-skills [tool.mypy] strict block (since the path-extend
# trick does not apply to mypy). Keep in sync with cajias/lint-configs.
[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true
files = ["tests"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
